name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate and test (Claude Code ${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        claude-code: ["2.1.288", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - name: Validate the marketplace
        run: claude plugin validate --strict .
      - name: Validate the plugin and its mod
        run: claude plugin validate --strict .claude-plugin/plugin.json
      - name: Test
        run: claude plugin test .
